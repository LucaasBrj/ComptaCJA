<header class="entete">
  <div>
    <h1 class="entete__titre">Prestations</h1>
    <p class="entete__sous-titre">Codes réutilisables pour préremplir une ligne de devis.</p>
  </div>
  <button matButton="filled" type="button" (click)="ouvrir(null)">
    <mat-icon>add</mat-icon>
    Nouvelle prestation
  </button>
</header>

<mat-card class="carte">
  <table mat-table [dataSource]="prestations()">
    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef>Code</th>
      <td mat-cell *matCellDef="let ligne" class="mono">{{ ligne.code }}</td>
    </ng-container>
    <ng-container matColumnDef="libelle">
      <th mat-header-cell *matHeaderCellDef>Libellé</th>
      <td mat-cell *matCellDef="let ligne">{{ ligne.libelle }}</td>
    </ng-container>
    <ng-container matColumnDef="unite">
      <th mat-header-cell *matHeaderCellDef>Unité</th>
      <td mat-cell *matCellDef="let ligne">{{ libelleUnite(ligne.unite) }}</td>
    </ng-container>
    <ng-container matColumnDef="taux">
      <th mat-header-cell *matHeaderCellDef>TVA</th>
      <td mat-cell *matCellDef="let ligne">{{ ligne.tauxTvaDefaut }} — {{ libelleTaux(ligne.tauxTvaDefaut) }}</td>
    </ng-container>
    <ng-container matColumnDef="prix">
      <th mat-header-cell *matHeaderCellDef>Prix HT</th>
      <td mat-cell *matCellDef="let ligne">{{ ligne.prixUnitaireHtDefaut || '—' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let ligne">
        <button matIconButton type="button" aria-label="Modifier" (click)="ouvrir(ligne)">
          <mat-icon>edit</mat-icon>
        </button>
        <button matIconButton type="button" aria-label="Supprimer" (click)="supprimer(ligne)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="colonnes"></tr>
    <tr mat-row *matRowDef="let ligne; columns: colonnes"></tr>
  </table>
</mat-card>
